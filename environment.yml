name: fibrogen-env
channels:
  - conda-forge
dependencies:
  - gcc_linux-64=15.2.0
  - gxx_linux-64=15.2.0
  - make=4.4.1
  
  # Pinned to 8.4.0 to avoid GCC 15 incompatibilities with newer Octave versions
  - octave=8.4.0
  - graphicsmagick=1.3.45  # Required for Octave's 'image' package
  
  - python=3.12
  - numpy>=2.0.0
  - pandas>=2.3.0
  - scipy>=1.14.0
  - matplotlib>=3.9.0
  - pyvista>=0.44.0